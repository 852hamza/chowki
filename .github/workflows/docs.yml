name: Docs

# Builds the documentation site from docs/ on every change to it, which
# fails on a broken link, and publishes it to GitHub Pages from main once
# the repository is public: GitHub Free has no Pages for private
# repositories, and a site shouldn't go live before the code does.
on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "project.env", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "project.env", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # the site's address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # each page's last update comes from git history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - id: pages
        if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
